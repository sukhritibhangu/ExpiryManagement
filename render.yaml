services:
  - type: web
    name: expiry-alert-ledger
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /status/alive
    disk:
      name: ledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LEDGER_BROWSER_DATA
        value: /var/data/ledger
      - key: TZ
        value: Asia/Kolkata
